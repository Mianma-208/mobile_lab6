<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1D4ED8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="5" y="5" width="90" height="90" rx="26" ry="26" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Emblem: Stylized Barbell / Wings / Pulse matching screenshot -->
  <!-- Central Barbell shaft -->
  <rect x="36" y="47" width="28" height="6" rx="3" fill="#FFFFFF"/>
  <!-- Central Weight grip rings -->
  <rect x="46" y="45" width="8" height="10" rx="2" fill="#F8FAFC"/>
  
  <!-- Left Weight Plates with stylish wings -->
  <path d="M 28 34 C 32 34 34 38 34 50 C 34 62 32 66 28 66 C 24 66 22 60 22 50 C 22 40 24 34 28 34 Z" fill="#F59E0B"/>
  <path d="M 32 38 C 34 38 35 43 35 50 C 35 57 34 62 32 62 C 30 62 29 57 29 50 C 29 43 30 38 32 38 Z" fill="#FDE047"/>
  
  <!-- Right Weight Plates with stylish wings -->
  <path d="M 72 34 C 68 34 66 38 66 50 C 66 62 68 66 72 66 C 76 66 78 60 78 50 C 78 40 76 34 72 34 Z" fill="#F59E0B"/>
  <path d="M 68 38 C 66 38 65 43 65 50 C 65 57 66 62 68 62 C 70 62 71 57 71 50 C 71 43 70 38 68 38 Z" fill="#FDE047"/>

  <!-- Dynamic Energy V / Pulse line -->
  <path d="M 38 38 L 50 26 L 62 38" stroke="#FDE047" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 42 64 L 50 74 L 58 64" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
</svg>
